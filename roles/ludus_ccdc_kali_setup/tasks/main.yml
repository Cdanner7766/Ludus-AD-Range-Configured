---
# tasks file for ludus_ccdc_kali_setup
# Installs the kali-linux-default metapackage on Kali attacker VMs.
# kali-linux-default is a large download (~2-3 GB) — this task can take
# 15-30 minutes depending on network speed and mirrors.

# Force the official Kali CDN mirror so we aren't locked to a single
# geographic mirror that may be temporarily unreachable.
- name: Set Kali sources.list to official CDN mirror
  ansible.builtin.copy:
    content: |
      deb http://http.kali.org/kali kali-rolling main contrib non-free non-free-firmware
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true

# Use shell so we can pass --fix-missing (not available on the apt module).
# --fix-missing skips packages whose .deb can't be fetched and retries the
# rest, so a single bad mirror entry won't abort the entire install.
# Retries 3 times with a 60s delay in case of transient network errors.
- name: Install kali-linux-default tools
  ansible.builtin.shell: |
    DEBIAN_FRONTEND=noninteractive apt-get install -y --fix-missing kali-linux-default
  args:
    executable: /bin/bash
  become: true
  register: apt_result
  until: apt_result.rc == 0
  retries: 3
  delay: 60
  changed_when: "'newly installed' in apt_result.stdout or 'upgraded' in apt_result.stdout"
