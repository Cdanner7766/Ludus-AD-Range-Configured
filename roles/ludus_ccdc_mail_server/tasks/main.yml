---
# tasks file for ludus_ccdc_mail_server
# Configures Postfix + Dovecot mail server with intentional CCDC vulnerabilities

# Purge any existing Postfix installation so every role run starts from a clean
# slate.  This eliminates stale configs, broken chroot state, or corrupted
# binaries from a previous (possibly partial) install that could prevent smtpd
# from spawning correctly.
- name: "Purge existing Postfix installation for a clean rebuild"
  ansible.builtin.apt:
    name: postfix
    state: absent
    purge: true
  become: true

# Install Postfix and Dovecot (do NOT run apt upgrade)
- name: "Set Postfix preseed selections for non-interactive install"
  ansible.builtin.shell: |
    debconf-set-selections <<EOF
    postfix postfix/main_mailer_type select Internet Site
    postfix postfix/mailname string ludus.domain
    EOF
  become: true

- name: "Install mail server packages"
  ansible.builtin.apt:
    name:
      - postfix
      - dovecot-imapd
      - dovecot-pop3d
      - mailutils
    state: present
    update_cache: true
  become: true

# VULN: Configure Postfix as an open relay
- name: "VULN - Configure Postfix as open relay"
  ansible.builtin.copy:
    dest: /etc/postfix/main.cf
    content: |
      # INSECURE Postfix configuration - OPEN RELAY
      # Secure option (DISABLED): smtpd_relay_restrictions = permit_mynetworks, permit_sasl_authenticated, defer_unauth_destination
      # Secure option (DISABLED): smtpd_tls_cert_file = /etc/ssl/certs/ssl-cert-snakeoil.pem
      # Secure option (DISABLED): smtpd_tls_key_file = /etc/ssl/private/ssl-cert-snakeoil.key
      # Secure option (DISABLED): smtpd_tls_security_level = may

      smtpd_banner = $myhostname ESMTP $mail_name (Debian/GNU)
      biff = no
      append_dot_mydomain = no

      myhostname = mail.ludus.domain
      mydomain = ludus.domain
      myorigin = $mydomain
      mydestination = $myhostname, ludus.domain, localhost.localdomain, localhost
      mynetworks = 0.0.0.0/0

      # VULN: Accept mail from anyone (open relay)
      smtpd_relay_restrictions = permit

      # VULN: No TLS - all traffic in cleartext
      smtpd_tls_security_level = none

      # VULN: No SASL authentication required
      smtpd_sasl_auth_enable = no

      inet_interfaces = all
      inet_protocols = ipv4
      mailbox_size_limit = 0
      recipient_delimiter = +
      home_mailbox = Maildir/

      # Disable ALL DNS lookups in smtpd (replaces removed smtpd_peername_lookups).
      # Postfix 3.x (Debian 12) removed smtpd_peername_lookups; using it produces
      # "unused parameter" warning and the setting is silently ignored — smtpd
      # still does reverse PTR lookups on each client IP. The scoring engine's IP
      # has no PTR record, so each connection hangs for 15-30s before the 220
      # banner is sent, exceeding the 10s socket timeout.
      # disable_dns_lookups=yes is the supported replacement in Postfix 3.x.
      disable_dns_lookups = yes
    owner: root
    group: root
    mode: "0644"
  become: true

# VULN: Configure Dovecot to allow plaintext auth without TLS
- name: "VULN - Configure insecure Dovecot"
  ansible.builtin.copy:
    dest: /etc/dovecot/dovecot.conf
    content: |
      # INSECURE Dovecot configuration
      # Secure option (DISABLED): ssl = required
      # Secure option (DISABLED): disable_plaintext_auth = yes

      protocols = imap pop3
      listen = *

      # VULN: Allow plaintext authentication (credentials sent in clear)
      disable_plaintext_auth = no

      # VULN: No SSL/TLS required
      ssl = no

      mail_location = maildir:~/Maildir

      passdb {
        driver = pam
      }

      userdb {
        driver = passwd
      }

      namespace inbox {
        inbox = yes
      }
    owner: root
    group: root
    mode: "0644"
  become: true

# VULN: Create weak mail user accounts
# Note: 'mail' is a Debian system user (uid 8) that already exists.
# useradd will fail for it, so we separate account creation from password
# setting so chpasswd always runs regardless of whether useradd succeeded.
- name: "VULN - Create weak mail user accounts"
  ansible.builtin.shell: |
    useradd -m -s /bin/bash mail 2>/dev/null || true
    useradd -m -s /bin/bash admin 2>/dev/null || true
    useradd -m -s /bin/bash user 2>/dev/null || true
    echo 'mail:mail'     | chpasswd
    echo 'admin:admin'   | chpasswd
    echo 'user:password' | chpasswd
    echo 'root:toor'     | chpasswd
    # Create Maildir for each user
    mkdir -p /home/mail/Maildir/{new,cur,tmp}
    mkdir -p /home/admin/Maildir/{new,cur,tmp}
    mkdir -p /home/user/Maildir/{new,cur,tmp}
    chown -R mail:mail /home/mail/Maildir
    chown -R admin:admin /home/admin/Maildir
    chown -R user:user /home/user/Maildir
  become: true
  ignore_errors: true

# Create realistic employee mail accounts
# jsmith is used by the scoring engine for IMAP checks (default credential).
# bwilson and mchen are additional employees that make the mailserver
# look realistic; blue team may change their passwords without affecting scoring.
- name: "Create Ludus Corporation employee mail accounts"
  ansible.builtin.shell: |
    useradd -m -s /bin/bash jsmith  2>/dev/null || true
    useradd -m -s /bin/bash bwilson 2>/dev/null || true
    useradd -m -s /bin/bash mchen   2>/dev/null || true
    echo 'jsmith:Ludus2025!'  | chpasswd
    echo 'bwilson:Ludus2025!' | chpasswd
    echo 'mchen:Ludus2025!'   | chpasswd
    mkdir -p /home/jsmith/Maildir/{new,cur,tmp}
    mkdir -p /home/bwilson/Maildir/{new,cur,tmp}
    mkdir -p /home/mchen/Maildir/{new,cur,tmp}
    chown -R jsmith:jsmith   /home/jsmith/Maildir
    chown -R bwilson:bwilson /home/bwilson/Maildir
    chown -R mchen:mchen     /home/mchen/Maildir
  become: true
  ignore_errors: true

# VULN: Disable firewall
- name: "VULN - Disable firewall"
  ansible.builtin.shell: |
    ufw disable || true
    iptables -F || true
    iptables -P INPUT ACCEPT || true
    iptables -P FORWARD ACCEPT || true
    iptables -P OUTPUT ACCEPT || true
  become: true

# Postfix smtpd resolves $myhostname before sending the 220 banner.
# Without a local hosts entry, this DNS lookup stalls (mail.ludus.domain
# has no PTR/forward record resolvable inside the chroot), causing smtpd
# to hang indefinitely on every connection — no banner is ever sent.
- name: "Add mail.ludus.domain to /etc/hosts for local Postfix hostname resolution"
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 mail.ludus.domain"
    state: present
  become: true

- name: "Sync /etc/hosts into Postfix chroot so smtpd can resolve hostname"
  ansible.builtin.copy:
    src: /etc/hosts
    dest: /var/spool/postfix/etc/hosts
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  become: true

# Debian 12 ships AppArmor profiles for each Postfix binary
# (e.g. /etc/apparmor.d/usr.lib.postfix.smtpd).  When AppArmor is active
# and enforcing, a profile that denies a required operation (e.g. a missing
# /dev/log socket, a capability, or a path) causes smtpd to be killed silently
# before it sends the 220 banner — with no log entry because syslog itself may
# be the denied resource.  This is the most likely cause of smtpd never
# appearing in `ps` and the scoring engine timing out on every check.
# Disabling all Postfix AppArmor profiles eliminates this failure mode entirely.
- name: "Disable AppArmor profiles for Postfix (prevents smtpd silent kill)"
  ansible.builtin.shell: |
    if command -v aa-disable >/dev/null 2>&1; then
      for profile in /etc/apparmor.d/usr.lib.postfix.*; do
        [ -f "$profile" ] && aa-disable "$profile" 2>/dev/null || true
      done
      # Reload AppArmor policy so the aa-disable takes effect immediately
      systemctl reload apparmor 2>/dev/null || true
    fi
  become: true
  ignore_errors: true

- name: "Start and enable mail services"
  ansible.builtin.shell: |
    systemctl enable postfix
    systemctl restart postfix
    systemctl enable dovecot
    systemctl restart dovecot
  become: true
